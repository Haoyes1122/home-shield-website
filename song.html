<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>漏水別拖啦｜Home Shield</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
:root{--page:#e9eef2;--ink:#102638;--navy:#102638;--water:#3fa7d6;--amber:#f2a541;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0a141c;--ink:#dce8ef}}
:root[data-theme="dark"]{--page:#0a141c;--ink:#dce8ef}
*{box-sizing:border-box;margin:0}
body{background:var(--page);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
#frame{width:min(360px,94vw,calc((100vh - 80px)*9/16));aspect-ratio:9/16;position:relative;overflow:hidden;border-radius:18px;background:var(--navy);color:#fff;container-type:inline-size;cursor:pointer;user-select:none}
.tagline{position:absolute;top:5cqw;left:6cqw;font-size:3.2cqw;letter-spacing:.14em;color:var(--water);font-weight:700}
.dbg{position:absolute;top:5cqw;right:6cqw;font-size:3.2cqw;color:#fff;opacity:.8;font-variant-numeric:tabular-nums}
.house{position:absolute;left:50%;top:15cqw;width:78cqw;margin-left:-39cqw;overflow:visible}
.ln{fill:rgba(255,255,255,.07);stroke:rgba(255,255,255,.85);stroke-width:2.2;stroke-linejoin:round;transition:stroke .6s}
.g7 .ln{stroke:var(--water)}
.stain{fill:rgba(160,120,70,.85);transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform 2.4s ease-out}
.g0 .stain{transform:scale(1)}
.crack{fill:none;stroke:var(--amber);stroke-width:2;stroke-dasharray:90;stroke-dashoffset:90;transition:stroke-dashoffset 1s}
.g2 .crack{stroke-dashoffset:0}
.coatg{transform:translateY(170px);transition:transform .01s}
.g3 .coatg{transform:none;transition:transform 2.2s cubic-bezier(.6,0,.2,1)}
.drop{fill:#7cc4e8;opacity:0}
.c0 .drop,.c2 .drop{animation:fall 1.1s ease-in infinite}
@keyframes fall{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(46px);opacity:0}}
.shield{fill:rgba(16,38,56,0);stroke:#fff;stroke-width:3;stroke-dasharray:420;stroke-dashoffset:420;transition:fill .8s}
.g1 .shield{stroke-dashoffset:0;transition:stroke-dashoffset 1.5s ease-out,fill .8s}
.g3 .shield{fill:rgba(16,38,56,.55)}
.tick{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:70;stroke-dashoffset:70}
.g7 .tick{stroke-dashoffset:0;transition:stroke-dashoffset .7s .3s}
.ring{fill:none;stroke:var(--water);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
.c7 .ring{animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(.7);opacity:.9}to{transform:scale(1.8);opacity:0}}
.phone{opacity:0;transform:translateX(50px);transition:opacity .5s,transform .5s}
.g4 .phone{opacity:1;transform:none}
.g6 .phone{opacity:0;transform:translateX(50px)}
.flash{fill:#fff;opacity:0}
.c4 .flash{animation:flash .9s .5s}
@keyframes flash{0%{opacity:0}30%{opacity:.9}100%{opacity:0}}
.scan{stroke:var(--water);stroke-width:2.5;opacity:0}
.c5 .scan{animation:scan 2.4s ease-in-out infinite}
@keyframes scan{0%{transform:translateY(30px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(140px);opacity:0}}
.chips{position:absolute;left:0;right:0;top:92cqw;display:flex;justify-content:center;gap:2.6cqw}
.chip{background:rgba(255,255,255,.1);border:1px solid rgba(63,167,214,.7);border-radius:99px;padding:2cqw 4.2cqw;font-size:4.4cqw;font-weight:700;opacity:0;transform:translateY(3cqw);transition:opacity .4s var(--d),transform .4s var(--d)}
.g6 .chip{opacity:1;transform:none}
#lyric{position:absolute;left:6cqw;right:6cqw;bottom:14cqw;text-align:center;font-weight:900;font-size:8cqw;line-height:1.35;min-height:22cqw;display:flex;align-items:flex-end;justify-content:center;text-shadow:0 2px 12px rgba(0,0,0,.35)}
#lyric span{display:block}
#lyric.in span{animation:lin .5s ease-out}
@keyframes lin{from{opacity:0;transform:translateY(4cqw) scale(.96)}to{opacity:1;transform:none}}
.bar{position:absolute;left:6cqw;right:6cqw;bottom:7cqw;height:.9cqw;background:rgba(255,255,255,.2);border-radius:1cqw;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:var(--water)}
.ov{position:absolute;inset:0;background:rgba(16,38,56,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4cqw;transition:opacity .3s}
.playing .ov{opacity:0;pointer-events:none}
.ov i{width:20cqw;height:20cqw;border-radius:50%;background:var(--water);display:grid;place-items:center;font-style:normal;font-size:9cqw;padding-left:1.4cqw}
.ov p{font-size:4.4cqw;font-weight:700}
.ov small{font-size:3.2cqw;opacity:.7;padding:0 8cqw;text-align:center}
.ctl{display:flex;gap:10px}
button{font:inherit;font-size:14px;padding:8px 18px;border-radius:99px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--water);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.c0 .drop,.c2 .drop,.c5 .scan,.c7 .ring,.c4 .flash{animation:none}.stain,.coatg{transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="frame" role="button" tabindex="0" aria-label="播放或暫停歌曲動畫">
  <div class="tagline">HOME SHIELD</div>
  <div class="dbg" id="dbg" hidden></div>

  <div id="stage" class="stage">
  <svg class="house" viewBox="0 0 200 170" aria-hidden="true">
    <defs><clipPath id="hc"><path d="M20 74 100 16 180 74V160H20Z"/></clipPath></defs>
    <path class="ln" d="M20 74 100 16 180 74V160H20Z"/>
    <g clip-path="url(#hc)">
      <ellipse class="stain" cx="118" cy="72" rx="42" ry="34"/>
      <path class="crack" d="M118 40 112 62 124 78 116 100 122 124"/>
      <g class="coatg"><rect width="200" height="170" fill="#3fa7d6"/></g>
    </g>
    <rect class="ln" x="86" y="112" width="28" height="48" style="fill:none"/>
    <circle class="drop" cx="112" cy="22" r="3.5"/><circle class="drop" cx="126" cy="14" r="3" style="animation-delay:.4s"/><circle class="drop" cx="104" cy="10" r="2.6" style="animation-delay:.8s"/>
    <path class="shield" d="M100 38 142 54V94C142 120 124 136 100 146 76 136 58 120 58 94V54Z"/>
    <path class="tick" d="M82 92 96 106 120 78"/>
    <circle class="ring" cx="100" cy="92" r="46"/>
    <g class="phone">
      <rect x="150" y="70" width="40" height="76" rx="7" fill="#102638" stroke="#fff" stroke-width="2.4"/>
      <circle cx="170" cy="86" r="6" fill="none" stroke="#fff" stroke-width="2"/>
      <rect x="156" y="98" width="28" height="40" rx="2" fill="rgba(63,167,214,.25)"/>
      <circle class="flash" cx="170" cy="86" r="14"/>
      <line class="scan" x1="154" y1="0" x2="186" y2="0"/>
    </g>
  </svg>
  <div class="chips"><span class="chip" style="--d:0s">防水</span><span class="chip" style="--d:1.2s">止滑</span><span class="chip" style="--d:2.4s">安心</span></div>
  </div>

  <div id="lyric" aria-live="polite"></div>
  <div class="bar"><b id="prog"></b></div>
  <div class="ov" id="ov"><i>▶</i><p id="ovt">點擊播放歌曲</p><small id="ovs"></small></div>
</div>
<div class="ctl"><button id="rp" type="button">重新播放</button></div>
<audio id="a" src="/music.mp3" preload="metadata"></audio>

<script>
(function(){
  /* 歌詞與開始秒數（相對於 music.mp3）。聽過歌曲後，只要改左邊的秒數即可。 */
  var LINES=[
    [0.5,'滴答滴答～漏水啦！'],
    [4.4,'Home Shield～快來啦！'],
    [8.3,'漏水別拖啦！別拖啦！'],
    [12.2,'Home Shield 來啦！來啦！'],
    [16.1,'拍一拍～傳一傳～'],
    [20.0,'AI 幫你看一看！'],
    [23.9,'防水啦！止滑啦！安心啦！'],
    [27.8,'Home Shield～守護咱們的家！']
  ];
  var a=document.getElementById('a'),frame=document.getElementById('frame'),stage=document.getElementById('stage'),
      lyric=document.getElementById('lyric'),prog=document.getElementById('prog'),ov=document.getElementById('ov'),
      ovt=document.getElementById('ovt'),ovs=document.getElementById('ovs'),dbg=document.getElementById('dbg'),
      cur=-2,raf=0;
  if(location.search.indexOf('debug')>-1)dbg.hidden=false;
  function idxAt(t){var k=-1;for(var i=0;i<LINES.length;i++)if(t>=LINES[i][0])k=i;return k}
  function apply(k){
    if(k===cur)return;cur=k;
    var c='stage';for(var i=0;i<=k;i++)c+=' g'+i;if(k>=0)c+=' c'+k;
    stage.className=c;
    lyric.className='';
    lyric.innerHTML=k>=0?'<span></span>':'';
    if(k>=0){lyric.firstChild.textContent=LINES[k][1];void lyric.offsetWidth;lyric.className='in'}
  }
  function loop(){
    var t=a.currentTime;apply(idxAt(t));
    if(a.duration)prog.style.width=Math.min(100,t/a.duration*100)+'%';
    if(!dbg.hidden)dbg.textContent=t.toFixed(1)+'s / 第'+(cur+1)+'句';
    raf=requestAnimationFrame(loop);
  }
  function play(){
    var p=a.play();
    if(p&&p.catch)p.catch(function(){ovt.textContent='無法播放';ovs.textContent='請確認 music.mp3 已上傳到網站第一層。';frame.classList.remove('playing')});
    frame.classList.add('playing');cancelAnimationFrame(raf);loop();
  }
  function pause(){a.pause();frame.classList.remove('playing');ovt.textContent='繼續播放';cancelAnimationFrame(raf)}
  function toggle(){a.paused?play():pause()}
  function replay(){cur=-2;a.currentTime=0;apply(-1);play()}
  frame.addEventListener('click',toggle);
  frame.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});
  document.getElementById('rp').addEventListener('click',replay);
  a.addEventListener('ended',function(){frame.classList.remove('playing');ovt.textContent='重新播放';cancelAnimationFrame(raf);prog.style.width='100%'});
  a.addEventListener('error',function(){ovt.textContent='歌曲載入失敗';ovs.textContent='請確認 music.mp3 已上傳到網站第一層。'});
  document.addEventListener('visibilitychange',function(){if(document.hidden&&!a.paused)pause()});
  apply(-1);
})();
</script>
</body>
</html>
