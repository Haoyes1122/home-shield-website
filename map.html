<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>房屋漏水位置圖｜Home Shield</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
:root{--bg:#f2f5f7;--card:#fff;--ink:#102638;--mute:#5b6f7e;--line:#d5dee5;--water:#2b8fc0;--amber:#e08a1e;--chip:#eaf1f6;--zone:#dfe8ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1822;--card:#142636;--ink:#e4eef4;--mute:#93a9b8;--line:#27425a;--chip:#1c3347;--zone:#1f3a50;--water:#52b4e2}}
:root[data-theme="dark"]{--bg:#0c1822;--card:#142636;--ink:#e4eef4;--mute:#93a9b8;--line:#27425a;--chip:#1c3347;--zone:#1f3a50;--water:#52b4e2}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6;padding:16px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:22px;font-weight:900;line-height:1.35}
.sub{color:var(--mute);font-size:14px;margin:6px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
svg{display:block;width:min(340px,100%);margin:0 auto;overflow:visible}
.zone{fill:var(--zone);stroke:var(--ink);stroke-width:2;stroke-linejoin:round;cursor:pointer;transition:fill .25s}
.zone:hover{fill:rgba(43,143,192,.35)}
.zone.sel{fill:rgba(224,138,30,.45);stroke:var(--amber)}
.zone:focus-visible{outline:none;stroke:var(--water);stroke-width:4}
.deco{fill:none;stroke:var(--ink);stroke-width:2;opacity:.5}
.dot{fill:var(--water);pointer-events:none}
.pulse{fill:none;stroke:var(--water);stroke-width:2;pointer-events:none;transform-box:fill-box;transform-origin:center;animation:p 2s ease-out infinite}
@keyframes p{from{transform:scale(.6);opacity:.9}to{transform:scale(2.6);opacity:0}}
.lab{font-size:11px;font-weight:700;fill:var(--ink);pointer-events:none;text-anchor:middle}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center}
button{font:inherit;cursor:pointer}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:99px;padding:8px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--water);border-color:var(--water);color:#fff;font-weight:700}
button:focus-visible,a:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.info h2{font-size:19px;font-weight:900;margin-bottom:8px}
.info h3{font-size:13px;color:var(--mute);margin-top:12px}
.info p{font-size:15px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{border-radius:99px;padding:11px 20px;font-size:15px;font-weight:700;text-decoration:none;border:1px solid var(--water);text-align:center}
.pri{background:var(--water);color:#fff}.sec{color:var(--water)}
.note{margin-top:12px;font-size:12px;color:var(--mute)}
.empty{color:var(--mute);font-size:15px}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:0}*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>房子哪裡容易漏水？</h1>
  <p class="sub">點選房屋上的位置，了解常見徵兆與可能原因。</p>

  <div class="card">
    <svg viewBox="0 0 320 250" role="group" aria-label="房屋示意圖">
      <rect class="zone" data-k="wall" tabindex="0" role="button" aria-label="外牆" x="40" y="96" width="210" height="130"/>
      <polygon class="zone" data-k="roof" tabindex="0" role="button" aria-label="屋頂與頂樓" points="24,96 145,22 266,96"/>
      <rect class="zone" data-k="window" tabindex="0" role="button" aria-label="窗框" x="62" y="124" width="56" height="46" rx="3"/>
      <rect class="zone" data-k="bath" tabindex="0" role="button" aria-label="浴室" x="176" y="126" width="56" height="56" rx="3"/>
      <rect class="zone" data-k="balcony" tabindex="0" role="button" aria-label="陽台" x="250" y="150" width="58" height="26" rx="3"/>
      <path class="deco" d="M250 150v-26M308 150v-26M250 124h58M279 124v26M120 226V196h-30v30"/>
      <g id="dots"></g>
      <text class="lab" x="145" y="66">屋頂</text>
      <text class="lab" x="90" y="152">窗框</text>
      <text class="lab" x="204" y="158">浴室</text>
      <text class="lab" x="279" y="168">陽台</text>
      <text class="lab" x="145" y="216">外牆</text>
    </svg>
    <div class="chips" id="chips"></div>
  </div>

  <div class="card info" id="info" aria-live="polite"><p class="empty">請點選上方房屋的任一位置，或選擇下方的按鈕。</p></div>
</div>

<script>
(function(){
  var D={
    roof:{t:'屋頂與頂樓',s:'頂樓地面龜裂或積水；頂樓下方的天花板出現水痕、油漆鼓起。',c:'長期日曬雨淋使防水層老化，或排水不順造成積水。',a:'下雨後觀察是否積水，並拍照記錄範圍。若下方樓層已出現水痕，建議安排檢查。'},
    wall:{t:'外牆',s:'外牆出現裂縫；室內牆面有壁癌、白色結晶、油漆或壁紙起泡。',c:'外牆裂縫或接縫讓雨水滲入牆體。',a:'記錄裂縫的位置與寬度，之後比較是否變大。同一面牆的室內外一起觀察，判斷會更準確。'},
    window:{t:'窗框',s:'窗邊牆面出現水痕；下雨時窗框縫隙滲水。',c:'窗框周圍的填縫老化，或窗框與牆面之間有縫隙。',a:'雨天或雨後觀察窗邊是否潮濕，並拍下滲水的位置。'},
    bath:{t:'浴室',s:'磁磚縫發黑、牆角潮濕；樓下天花板出現水痕。',c:'可能與管線接頭或地面防水層的狀況有關，需要先分辨水的來源。',a:'留意是否只在使用水之後才出現徵兆。若樓下已受影響，建議盡快安排檢查。'},
    balcony:{t:'陽台',s:'地面長期積水；排水孔周圍潮濕；牆面與地面交界處滲水。',c:'排水不順，或牆面與地面交界處的防水老化。',a:'清理排水孔並觀察排水速度。交界處若反覆潮濕，建議評估處理方式。'}
  };
  var svg=document.querySelector('svg'),zones=[].slice.call(svg.querySelectorAll('.zone')),chips=document.getElementById('chips'),info=document.getElementById('info'),NS='http://www.w3.org/2000/svg';
  var pos={roof:[145,44],wall:[145,190],window:[90,138],bath:[204,140],balcony:[279,162]};
  Object.keys(pos).forEach(function(k){
    [['pulse',8],['dot',4]].forEach(function(p){var c=document.createElementNS(NS,'circle');c.setAttribute('class',p[0]);c.setAttribute('cx',pos[k][0]);c.setAttribute('cy',pos[k][1]);c.setAttribute('r',p[1]);document.getElementById('dots').appendChild(c)});
  });
  var btns={};
  Object.keys(D).forEach(function(k){
    var b=document.createElement('button');b.type='button';b.className='chip';b.textContent=D[k].t;b.setAttribute('aria-pressed','false');b.onclick=function(){pick(k)};
    chips.appendChild(b);btns[k]=b;
  });
  zones.forEach(function(z){
    var k=z.dataset.k;z.onclick=function(){pick(k)};
    z.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(k)}};
  });
  function pick(k){
    var d=D[k];
    zones.forEach(function(z){z.classList.toggle('sel',z.dataset.k===k)});
    Object.keys(btns).forEach(function(x){btns[x].setAttribute('aria-pressed',x===k)});
    info.innerHTML='<h2>'+d.t+'</h2><h3>常見徵兆</h3><p>'+d.s+'</p><h3>可能原因</h3><p>'+d.c+'</p><h3>建議做法</h3><p>'+d.a+'</p>'+
      '<div class="acts"><a class="btn pri" href="/check.html" target="_top">做完整自我檢查</a><a class="btn sec" href="/contact.html" target="_top">預約房屋健檢</a></div>'+
      '<p class="note">以上為一般常見情形的說明，實際原因與處理方式，以現場評估為準。</p>';
  }
})();
</script>
</body>
</html>
