<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Shield 短影音</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
:root{--page:#e9eef2;--ink:#102638;--navy:#102638;--water:#3fa7d6;--foam:#dff1fa;--amber:#f2a541;--wall:#d9d2c5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0a141c;--ink:#dce8ef}}
:root[data-theme="dark"]{--page:#0a141c;--ink:#dce8ef}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--page);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
#frame{width:min(360px,92vw,calc((100vh - 90px)*9/16));aspect-ratio:9/16;position:relative;overflow:hidden;border-radius:18px;background:var(--navy);color:#fff;cursor:pointer;container-type:inline-size;user-select:none}
.bars{position:absolute;top:2.2cqw;left:3cqw;right:3cqw;display:flex;gap:1.5cqw;z-index:9}
.bars i{flex:1;height:.9cqw;background:rgba(255,255,255,.25);border-radius:1cqw;overflow:hidden}
.bars b{display:block;height:100%;width:0;background:#fff}
.sc{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:10cqw 9cqw;opacity:0;visibility:hidden;transition:opacity .35s}
.sc.on{opacity:1;visibility:visible}
h2{font-weight:900;font-size:9.6cqw;line-height:1.3;letter-spacing:.02em}
p{font-size:4.6cqw;line-height:1.6;opacity:.85;margin-top:3cqw}
.tag{font-size:3.4cqw;letter-spacing:.12em;color:var(--water);font-weight:700;margin-bottom:3cqw}
.wall{position:relative;height:52cqw;border-radius:3cqw;background:var(--wall);overflow:hidden;margin-bottom:8cqw;background-image:linear-gradient(rgba(0,0,0,.06) 1px,transparent 1px);background-size:100% 13cqw}
.stain{position:absolute;left:30%;top:-10%;width:60cqw;height:60cqw;border-radius:46% 54% 50% 50%;background:radial-gradient(circle,rgba(92,70,40,.75),rgba(92,70,40,.2) 70%,transparent);transform:scale(0)}
.on .stain{animation:grow 2s .2s ease-out forwards}
@keyframes grow{to{transform:scale(1)}}
.drip{position:absolute;top:30%;width:1.6cqw;height:0;background:rgba(80,60,35,.7);border-radius:1cqw}
.on .drip{animation:drip 1.8s ease-in forwards}
@keyframes drip{to{height:22cqw}}
.coat{position:absolute;inset:0;background:linear-gradient(180deg,var(--water),#1f7fb0);transform:translateY(101%)}
.on .coat{animation:rise 1.2s .2s cubic-bezier(.6,0,.2,1) forwards}
@keyframes rise{to{transform:translateY(0)}}
.pop{opacity:0;transform:translateY(4cqw)}
.on .pop{animation:pop .6s var(--d,0s) ease-out forwards}
@keyframes pop{to{opacity:1;transform:none}}
.big{font-size:21cqw;font-weight:900;line-height:1;letter-spacing:-.02em}
.big span{color:var(--water)}
.steps{list-style:none;padding:0;margin-top:6cqw;display:grid;gap:3.4cqw}
.steps li{display:flex;align-items:center;gap:4cqw;background:rgba(255,255,255,.08);padding:4cqw;border-radius:3cqw;font-size:5cqw;font-weight:700}
.steps em{font-style:normal;width:9cqw;height:9cqw;border-radius:50%;background:var(--water);color:var(--navy);display:grid;place-items:center;font-size:4.6cqw;flex:none}
.card{background:var(--foam);color:var(--navy);border-radius:3cqw;padding:6cqw;margin-top:6cqw}
.card b{display:block;font-size:3.6cqw;letter-spacing:.1em;opacity:.6;margin-bottom:3cqw}
.row{display:flex;justify-content:space-between;font-size:4.4cqw;padding:2.4cqw 0;border-top:1px solid rgba(16,38,56,.15)}
.row span:last-child{font-weight:700}
.url{margin-top:8cqw;font-size:4cqw;background:#fff;color:var(--navy);padding:3cqw 4cqw;border-radius:99px;font-weight:700;align-self:flex-start}
.hint{position:absolute;bottom:3cqw;left:0;right:0;text-align:center;font-size:3cqw;opacity:.45}
.ctl{display:flex;gap:10px}
button{font:inherit;font-size:14px;padding:8px 18px;border-radius:99px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--water);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.on .stain,.on .drip,.on .coat,.on .pop{animation-duration:.01s;animation-delay:0s}}

@property --n{syntax:'<integer>';initial-value:42;inherits:false}
.sc{overflow:hidden}
.rain{position:absolute;inset:0;pointer-events:none}
.rain i{position:absolute;top:-12cqw;width:.45cqw;height:7cqw;background:linear-gradient(transparent,rgba(170,215,242,.75));animation:fall linear infinite}
@keyframes fall{to{transform:translateY(200cqw)}}
.house{display:block;width:66cqw;margin:0 auto 6cqw;overflow:visible}
.house .ln{fill:rgba(255,255,255,.07);stroke:rgba(255,255,255,.85);stroke-width:2.2;stroke-linejoin:round}
.hstain{fill:rgba(160,120,70,.8);transform-box:fill-box;transform-origin:center;transform:scale(0)}
.on .hstain{animation:grow 2.2s .3s ease-out forwards}
.crack{fill:none;stroke:var(--amber);stroke-width:2;stroke-dasharray:90;stroke-dashoffset:90}
.on .crack{animation:draw 1s 1.2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.coatg{transform:translateY(170px)}
.on .coatg{animation:rise2 1.3s .3s cubic-bezier(.6,0,.2,1) forwards}
@keyframes rise2{to{transform:translateY(0)}}
.shield{fill:rgba(16,38,56,.55);stroke:#fff;stroke-width:3;stroke-dasharray:420;stroke-dashoffset:420}
.on .shield{animation:draw 1.1s 1.5s ease-out forwards}
.tick{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:70;stroke-dashoffset:70}
.on .tick{animation:draw .6s 2.4s ease-out forwards}
.gauge{margin-bottom:5cqw}
.gauge .lb{display:flex;justify-content:space-between;align-items:baseline;font-size:3.8cqw;opacity:.85}
.num{font-size:9cqw;font-weight:900;color:var(--amber);counter-reset:n var(--n)}
.num::after{content:counter(n) "%"}
.on .num{animation:cnt 2.6s .3s ease-out forwards}
@keyframes cnt{from{--n:42}to{--n:87}}
.gbar{height:2.4cqw;background:rgba(255,255,255,.15);border-radius:2cqw;margin-top:2cqw;overflow:hidden}
.gbar b{display:block;height:100%;width:42%;background:linear-gradient(90deg,var(--water),var(--amber));border-radius:2cqw}
.on .gbar b{animation:gw 2.6s .3s ease-out forwards}
@keyframes gw{to{width:87%}}
.ring{position:absolute;left:50%;top:60%;width:30cqw;height:30cqw;margin:-15cqw;border:.6cqw solid var(--water);border-radius:50%;opacity:0}
.on .ring{animation:rg 2.2s var(--d,2.4s) ease-out infinite}
@keyframes rg{from{transform:scale(.4);opacity:.8}to{transform:scale(3.2);opacity:0}}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:2.6cqw;margin-top:5cqw}
.chips span{background:rgba(255,255,255,.1);border:1px solid rgba(63,167,214,.5);border-radius:99px;padding:2.6cqw 3cqw;font-size:4cqw;font-weight:700;text-align:center}
.stamp{position:absolute;right:5cqw;top:50%;margin-top:-4.5cqw;width:9cqw;height:9cqw;border-radius:50%;border:.7cqw solid #1f9d6b;color:#1f9d6b;display:grid;place-items:center;font-size:5cqw;font-weight:900;opacity:0;transform:scale(2.4) rotate(-20deg)}
.on .stamp{animation:st .4s var(--d) cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes st{to{opacity:1;transform:scale(1) rotate(-8deg)}}
.row{position:relative;padding-right:14cqw}
@media (prefers-reduced-motion:reduce){.on .hstain,.on .crack,.on .coatg,.on .shield,.on .tick,.on .num,.on .gbar b,.on .stamp{animation-duration:.01s;animation-delay:0s}.rain{display:none}}
</style>
</head>
<body>
<div id="frame" role="img" aria-label="Home Shield 房屋防水短影音，點擊可暫停">
  <div class="bars" id="bars"></div>

  <section class="sc" data-d="3400">
    <div class="rain" data-rain></div>
    <div class="gauge pop"><div class="lb"><span>牆內濕度</span><span class="num"></span></div><div class="gbar"><b></b></div></div>
    <svg class="house" viewBox="0 0 200 170"><defs><clipPath id="hc"><path d="M20 74 100 16 180 74V160H20Z"/></clipPath></defs><path class="ln" d="M20 74 100 16 180 74V160H20Z"/><g clip-path="url(#hc)"><ellipse class="hstain" cx="118" cy="72" rx="42" ry="34"/><path class="crack" d="M118 40 112 62 124 78 116 100 122 124"/></g><rect class="ln" x="86" y="112" width="28" height="48"/></svg>
    <h2 class="pop" style="--d:.5s">漏水，從來不是<br>一夜之間發生。</h2>
    <p class="pop" style="--d:1.4s">等看見水痕，往往已經太晚。</p>
  </section>

  <section class="sc" data-d="3900">
    <div class="rain" data-rain></div><div class="ring"></div><div class="ring" style="--d:3.2s"></div>
    <div class="tag pop">HOME SHIELD</div>
    <svg class="house" viewBox="0 0 200 170"><defs><clipPath id="hc"><path d="M20 74 100 16 180 74V160H20Z"/></clipPath></defs><path class="ln" d="M20 74 100 16 180 74V160H20Z"/><g clip-path="url(#hc)"><ellipse cx="118" cy="72" rx="42" ry="34" fill="rgba(160,120,70,.8)"/><g class="coatg"><rect width="200" height="170" fill="#3fa7d6"/></g></g><rect class="ln" x="86" y="112" width="28" height="48" style="fill:none"/><path class="shield" d="M100 38 142 54V94C142 120 124 136 100 146 76 136 58 120 58 94V54Z"/><path class="tick" d="M82 92 96 106 120 78"/></svg>
    <div class="big pop" style="--d:2.6s;font-size:16cqw">BN<span>-</span>1000</div>
    <div class="chips"><span class="pop" style="--d:2.9s">產品選購</span><span class="pop" style="--d:3.05s">DIY 施工</span><span class="pop" style="--d:3.2s">專業施工</span><span class="pop" style="--d:3.35s">房屋健檢</span></div>
  </section>

  <section class="sc" data-d="3200">
    <div class="tag pop">房屋健康護照</div>
    <h2 class="pop" style="font-size:8cqw">每一次維護，<br>都有跡可循。</h2>
    <div class="card pop" style="--d:.4s"><b>HS / 001</b>
      <div class="row"><span>房屋健檢</span><i class="stamp" style="--d:.9s">✓</i></div>
      <div class="row"><span>BN-1000 防水施工</span><i class="stamp" style="--d:1.3s">✓</i></div>
      <div class="row"><span>維護紀錄建立</span><i class="stamp" style="--d:1.7s">✓</i></div></div>
    <div class="url pop" style="--d:2.1s">home-shield-website.shihhao1122.workers.dev</div>
  </section>

  <div class="hint" id="hint">點擊畫面暫停／繼續</div>
</div>
<div class="ctl">
  <button id="replay">重新播放</button>
  <button id="toggle">暫停</button>
</div>

<script>
(function(){
  [].forEach.call(document.querySelectorAll('[data-rain]'),function(r){for(var k=0;k<16;k++){var d=document.createElement('i');d.style.left=(k*6.4+Math.random()*4)+'%';d.style.animationDuration=(.8+Math.random()*.6)+'s';d.style.animationDelay=(-Math.random()*1.4)+'s';r.appendChild(d)}});
  var scs=[].slice.call(document.querySelectorAll('.sc')),bars=document.getElementById('bars'),fills=[];
  scs.forEach(function(){var i=document.createElement('i'),b=document.createElement('b');i.appendChild(b);bars.appendChild(i);fills.push(b)});
  var idx=0,t0=0,elapsed=0,paused=false,raf=0;
  function show(n){
    scs.forEach(function(s,i){s.classList.remove('on')});
    void document.body.offsetWidth;
    scs[n].classList.add('on');
    fills.forEach(function(f,i){f.style.width=i<n?'100%':'0'});
  }
  function go(n){idx=n%scs.length;elapsed=0;t0=performance.now();show(idx)}
  function tick(now){
    if(!paused){
      var d=+scs[idx].dataset.d,e=elapsed+(now-t0);
      fills[idx].style.width=Math.min(100,e/d*100)+'%';
      if(e>=d){go(idx+1)}
    }
    raf=requestAnimationFrame(tick);
  }
  function setPause(p){
    if(p===paused)return;
    var now=performance.now();
    if(p){elapsed+=now-t0}else{t0=now}
    paused=p;
    document.getElementById('toggle').textContent=p?'繼續':'暫停';
    scs[idx].style.animationPlayState=p?'paused':'running';
    [].forEach.call(scs[idx].querySelectorAll('*'),function(el){el.style.animationPlayState=p?'paused':'running'});
  }
  document.getElementById('frame').addEventListener('click',function(){document.getElementById('hint').style.display='none';setPause(!paused)});
  document.getElementById('toggle').addEventListener('click',function(){setPause(!paused)});
  document.getElementById('replay').addEventListener('click',function(){
    setPause(false);
    [].forEach.call(document.querySelectorAll('.sc *'),function(el){el.style.animationPlayState=''});
    go(0)
  });
  go(0);raf=requestAnimationFrame(tick);
})();
</script>
</body>
</html>
