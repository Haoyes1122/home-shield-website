<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Shield 短影音</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
:root{--page:#e9eef2;--ink:#102638;--navy:#102638;--water:#3fa7d6;--foam:#dff1fa;--amber:#f2a541;--wall:#d9d2c5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0a141c;--ink:#dce8ef}}
:root[data-theme="dark"]{--page:#0a141c;--ink:#dce8ef}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--page);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
#frame{width:min(360px,92vw,calc((100vh - 90px)*9/16));aspect-ratio:9/16;position:relative;overflow:hidden;border-radius:18px;background:var(--navy);color:#fff;cursor:pointer;container-type:inline-size;user-select:none}
.bars{position:absolute;top:2.2cqw;left:3cqw;right:3cqw;display:flex;gap:1.5cqw;z-index:9}
.bars i{flex:1;height:.9cqw;background:rgba(255,255,255,.25);border-radius:1cqw;overflow:hidden}
.bars b{display:block;height:100%;width:0;background:#fff}
.sc{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:10cqw 9cqw;opacity:0;visibility:hidden;transition:opacity .35s}
.sc.on{opacity:1;visibility:visible}
h2{font-weight:900;font-size:9.6cqw;line-height:1.3;letter-spacing:.02em}
p{font-size:4.6cqw;line-height:1.6;opacity:.85;margin-top:3cqw}
.tag{font-size:3.4cqw;letter-spacing:.12em;color:var(--water);font-weight:700;margin-bottom:3cqw}
.wall{position:relative;height:52cqw;border-radius:3cqw;background:var(--wall);overflow:hidden;margin-bottom:8cqw;background-image:linear-gradient(rgba(0,0,0,.06) 1px,transparent 1px);background-size:100% 13cqw}
.stain{position:absolute;left:30%;top:-10%;width:60cqw;height:60cqw;border-radius:46% 54% 50% 50%;background:radial-gradient(circle,rgba(92,70,40,.75),rgba(92,70,40,.2) 70%,transparent);transform:scale(0)}
.on .stain{animation:grow 2s .2s ease-out forwards}
@keyframes grow{to{transform:scale(1)}}
.drip{position:absolute;top:30%;width:1.6cqw;height:0;background:rgba(80,60,35,.7);border-radius:1cqw}
.on .drip{animation:drip 1.8s ease-in forwards}
@keyframes drip{to{height:22cqw}}
.coat{position:absolute;inset:0;background:linear-gradient(180deg,var(--water),#1f7fb0);transform:translateY(101%)}
.on .coat{animation:rise 1.2s .2s cubic-bezier(.6,0,.2,1) forwards}
@keyframes rise{to{transform:translateY(0)}}
.pop{opacity:0;transform:translateY(4cqw)}
.on .pop{animation:pop .6s var(--d,0s) ease-out forwards}
@keyframes pop{to{opacity:1;transform:none}}
.big{font-size:21cqw;font-weight:900;line-height:1;letter-spacing:-.02em}
.big span{color:var(--water)}
.steps{list-style:none;padding:0;margin-top:6cqw;display:grid;gap:3.4cqw}
.steps li{display:flex;align-items:center;gap:4cqw;background:rgba(255,255,255,.08);padding:4cqw;border-radius:3cqw;font-size:5cqw;font-weight:700}
.steps em{font-style:normal;width:9cqw;height:9cqw;border-radius:50%;background:var(--water);color:var(--navy);display:grid;place-items:center;font-size:4.6cqw;flex:none}
.card{background:var(--foam);color:var(--navy);border-radius:3cqw;padding:6cqw;margin-top:6cqw}
.card b{display:block;font-size:3.6cqw;letter-spacing:.1em;opacity:.6;margin-bottom:3cqw}
.row{display:flex;justify-content:space-between;font-size:4.4cqw;padding:2.4cqw 0;border-top:1px solid rgba(16,38,56,.15)}
.row span:last-child{font-weight:700}
.url{margin-top:8cqw;font-size:4cqw;background:#fff;color:var(--navy);padding:3cqw 4cqw;border-radius:99px;font-weight:700;align-self:flex-start}
.hint{position:absolute;bottom:3cqw;left:0;right:0;text-align:center;font-size:3cqw;opacity:.45}
.ctl{display:flex;gap:10px}
button{font:inherit;font-size:14px;padding:8px 18px;border-radius:99px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--water);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.on .stain,.on .drip,.on .coat,.on .pop{animation-duration:.01s;animation-delay:0s}}
</style>
</head>
<body>
<div id="frame" role="img" aria-label="Home Shield 房屋防水短影音，點擊可暫停">
  <div class="bars" id="bars"></div>

  <section class="sc" data-d="3200">
    <div class="wall"><div class="stain"></div><div class="drip" style="left:42%"></div><div class="drip" style="left:58%;animation-delay:.6s"></div></div>
    <h2 class="pop" style="--d:.2s">牆上出現水痕，<br>才開始處理？</h2>
    <p class="pop" style="--d:1s">漏水不會一夜之間發生。</p>
  </section>

  <section class="sc" data-d="3600">
    <div class="wall"><div class="stain" style="transform:scale(1);animation:none"></div><div class="coat"></div></div>
    <div class="tag pop" style="--d:.8s">居家防水解決方案</div>
    <div class="big pop" style="--d:1s">BN<span>-</span>1000</div>
    <p class="pop" style="--d:1.6s">從防水開始，守護家的每一寸。</p>
  </section>

  <section class="sc" data-d="2700">
    <h2 class="pop">從了解房屋開始，<br>找到適合你的方案。</h2>
    <div class="url pop" style="--d:.7s">home-shield-website.shihhao1122.workers.dev</div>
  </section>

  <div class="hint" id="hint">點擊畫面暫停／繼續</div>
</div>
<div class="ctl">
  <button id="replay">重新播放</button>
  <button id="toggle">暫停</button>
</div>

<script>
(function(){
  var scs=[].slice.call(document.querySelectorAll('.sc')),bars=document.getElementById('bars'),fills=[];
  scs.forEach(function(){var i=document.createElement('i'),b=document.createElement('b');i.appendChild(b);bars.appendChild(i);fills.push(b)});
  var idx=0,t0=0,elapsed=0,paused=false,raf=0;
  function show(n){
    scs.forEach(function(s,i){s.classList.remove('on')});
    void document.body.offsetWidth;
    scs[n].classList.add('on');
    fills.forEach(function(f,i){f.style.width=i<n?'100%':'0'});
  }
  function go(n){idx=n%scs.length;elapsed=0;t0=performance.now();show(idx)}
  function tick(now){
    if(!paused){
      var d=+scs[idx].dataset.d,e=elapsed+(now-t0);
      fills[idx].style.width=Math.min(100,e/d*100)+'%';
      if(e>=d){go(idx+1)}
    }
    raf=requestAnimationFrame(tick);
  }
  function setPause(p){
    if(p===paused)return;
    var now=performance.now();
    if(p){elapsed+=now-t0}else{t0=now}
    paused=p;
    document.getElementById('toggle').textContent=p?'繼續':'暫停';
    scs[idx].style.animationPlayState=p?'paused':'running';
    [].forEach.call(scs[idx].querySelectorAll('*'),function(el){el.style.animationPlayState=p?'paused':'running'});
  }
  document.getElementById('frame').addEventListener('click',function(){document.getElementById('hint').style.display='none';setPause(!paused)});
  document.getElementById('toggle').addEventListener('click',function(){setPause(!paused)});
  document.getElementById('replay').addEventListener('click',function(){
    setPause(false);
    [].forEach.call(document.querySelectorAll('.sc *'),function(el){el.style.animationPlayState=''});
    go(0)
  });
  go(0);raf=requestAnimationFrame(tick);
})();
</script>
</body>
</html>
